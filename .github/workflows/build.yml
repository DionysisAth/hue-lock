name: Build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  JAVA_VERSION: '21'

jobs:
  test:
    name: Analyze & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  emulator:
    name: Emulator tests (debug + release APK)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A resident Gradle daemon (up to 8 GB heap, see android/gradle.properties)
      # starves the emulator. Use single-use daemons that exit after each build.
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Build the exact APK that gets published, so the emulator can test it.
      - name: Build release APK
        run: |
          # Test APK: always Google's test ads, so testers can tap them.
          flutter build apk --release --build-number ${{ github.run_number }} --dart-define=TEST_ADS=true
          cp build/app/outputs/flutter-apk/app-release.apk hue-lock.apk
      - name: Free memory for the emulator
        run: |
          (cd android && ./gradlew --stop) || true
          pkill -f KotlinCompileDaemon || true
          free -m
      - name: Test on emulator (release APK launch + full game flow)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # Release APK first (what users install), then the full game flow.
          script: |
            timeout 300 tool/ci/smoke_release.sh hue-lock.apk
            tool/ci/integration.sh
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs
          path: |
            integration.log
            ci-out/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: hue-lock-apk
          path: hue-lock.apk

  bundle:
    name: Store bundle (AAB)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The upload key comes from repository secrets (Settings > Secrets and
      # variables > Actions). Without them the bundle is debug-signed, which
      # still proves it builds but cannot be uploaded to Play.
      - name: Set up the upload key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # Exercise the signing setup with a throwaway key; not published.
            echo "::notice::No upload key secrets yet: the AAB is signed with a throwaway key and not published."
            KEYSTORE_PASSWORD=throwaway-$RANDOM$RANDOM
            KEY_PASSWORD=$KEYSTORE_PASSWORD
            KEY_ALIAS=upload
            keytool -genkeypair -keystore android/app/upload-keystore.jks \
              -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 1 \
              -alias upload -dname "CN=CI" \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Build release bundle (real ads, upload-key signed)
        run: |
          flutter build appbundle --release --build-number ${{ github.run_number }}
          cp build/app/outputs/bundle/release/app-release.aab hue-lock.aab
          # Fail unless it is signed, and not with the debug key.
          jarsigner -verify -verbose -certs hue-lock.aab > verify.txt || true
          grep -q "jar verified" verify.txt || { tail -20 verify.txt; exit 1; }
          if grep -q "CN=Android Debug" verify.txt; then
            echo "::error::The bundle is debug-signed"; exit 1
          fi
      - if: steps.key.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hue-lock-aab
          path: hue-lock.aab
      - name: Remove the key from the runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

  publish:
    name: Publish APK
    needs: [test, emulator, bundle]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hue-lock-apk
      - uses: actions/download-artifact@v4
        # Only there once the upload key secrets are set.
        continue-on-error: true
        with:
          name: hue-lock-aab
      - name: Publish download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hue Lock build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            hue-lock.apk
            hue-lock.aab
          body: |
            Test build from ${{ github.sha }}. Unit tests, the Android
            emulator integration test and a launch test of this exact APK
            passed.

            Version code ${{ github.run_number }}.

            - `hue-lock.apk`: for testing on your phone (Android 7.0+, allow
              "install unknown apps"). Always shows Google's test ads.
            - `hue-lock.aab` (once the upload key secrets are set): the
              store build for Google Play, with real ads, signed with your
              upload key.
