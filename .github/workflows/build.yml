name: Build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  JAVA_VERSION: '21'

jobs:
  test:
    name: Analyze & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  emulator:
    name: Emulator tests (debug + release APK)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Build the exact APK that gets published, so the emulator can test it.
      - name: Build release APK
        run: |
          flutter build apk --release --build-number ${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk hue-lock.apk
      - name: Test on emulator (integration test + release APK smoke test)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # Keep full logs as artifacts; print them without stack-frame noise.
          script: |
            timeout 900 flutter test integration_test/app_test.dart -d emulator-5554 --reporter expanded > integration.log 2>&1; status=$?; [ $status -eq 124 ] && echo '::error::integration test timed out after 15 min'; grep -vE '^(#[0-9]+ |\(elided|── callback)' integration.log | tail -n 250; exit $status
            timeout 300 tool/ci/smoke_release.sh hue-lock.apk
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs
          path: |
            integration.log
            ci-out/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: hue-lock-apk
          path: hue-lock.apk

  publish:
    name: Publish APK
    needs: [test, emulator]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hue-lock-apk
      - name: Publish download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hue Lock build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: hue-lock.apk
          body: |
            Test build from ${{ github.sha }}. Unit tests, the Android
            emulator integration test and a launch test of this exact APK
            passed.

            Install: download `hue-lock.apk` on an Android 7.0+ phone and
            allow "install unknown apps". Signed with a debug key and uses
            Google's test ad units - not for store upload.
